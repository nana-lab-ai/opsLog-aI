spring.application.name=OpsLog AI

# SQLite
spring.datasource.url=jdbc:sqlite:./opslogai.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Server
server.port=${PORT:18080}

# Logging
logging.level.com.example.opslogai=INFO
logging.level.org.springframework.security=WARN

# Directory Watch (ローカル業務利用向け機能)
# opslog.watch.enabled=true の場合、起動時にディレクトリ監視スレッドが起動します
# 公開環境や監視不要の環境では false のままにしてください
opslog.watch.enabled=false
opslog.watch.directory=C:/opslog-ai/watch
opslog.watch.file-extensions=.log,.txt
