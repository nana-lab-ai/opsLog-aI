<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{fragments/head :: head('障害チケット作成')}"></head>
<body class="bg-light">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div id="page-content">
        <div class="topnav">
            <h5 class="page-title"><i class="bi bi-ticket-detailed me-2 text-warning"></i><span data-i18n="create.title">障害チケット作成</span></h5>
            <div class="user-info">
                <a th:href="@{/incidents}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i><span data-i18n="create.back">一覧に戻る</span>
                </a>
            </div>
        </div>

        <div class="content-area">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}" data-i18n="bc.dashboard">ダッシュボード</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/incidents}" data-i18n="bc.incidents">障害一覧</a></li>
                    <li class="breadcrumb-item active" data-i18n="bc.newCreate">新規作成</li>
                </ol>
            </nav>

            <!-- レート制限エラー -->
            <div th:if="${rateLimitError}" class="alert alert-warning d-flex align-items-center gap-2">
                <i class="bi bi-clock-history flex-shrink-0"></i>
                <span th:text="${rateLimitError}"></span>
            </div>
            <!-- DB上限エラー -->
            <div th:if="${limitError}" class="alert alert-danger d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-circle flex-shrink-0"></i>
                <span th:text="${limitError}"></span>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-9">
                    <!-- Log entry info if coming from log analysis -->
                    <div th:if="${logEntry != null}" class="card mb-3" style="border-left:4px solid #4d7cfe;">
                        <div class="card-body py-2">
                            <div class="d-flex align-items-center gap-2">
                                <i class="bi bi-link-45deg text-primary fs-5"></i>
                                <div>
                                    <div style="font-size:12px; color:#7b89a8; font-weight:600;" data-i18n="create.relatedLog">関連ログエントリ</div>
                                    <div style="font-weight:500;" th:text="${logEntry.title}">ログタイトル</div>
                                </div>
                                <a th:href="@{/log/result/{id}(id=${logEntry.id})}"
                                   class="btn btn-sm btn-outline-primary ms-auto">
                                    <i class="bi bi-eye me-1"></i><span data-i18n="create.viewResult">解析結果を確認</span>
                                </a>
                            </div>
                        </div>
                    </div>

                    <form th:action="@{/incidents}" method="post" th:object="${form}">
                        <input type="hidden" th:field="*{logEntryId}">

                        <div class="card">
                            <div class="card-header">
                                <i class="bi bi-pencil me-2"></i><span data-i18n="create.basicInfo">基本情報</span>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        <span data-i18n="create.incTitle">障害タイトル</span> <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control"
                                           th:field="*{title}"
                                           th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'"
                                           placeholder="例: 本番APサーバー OOMによるサービス停止">
                                    <div class="invalid-feedback" th:errors="*{title}"></div>
                                </div>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">
                                            <span data-i18n="create.severity">重要度</span> <span class="text-danger">*</span>
                                        </label>
                                        <select class="form-select" th:field="*{severity}"
                                                th:classappend="${#fields.hasErrors('severity')} ? ' is-invalid'">
                                            <option value="">-- 選択してください --</option>
                                            <option th:each="sev : ${severities}"
                                                    th:value="${sev.name()}"
                                                    th:text="${sev.displayName}">重要度</option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{severity}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold" data-i18n="create.initialStatus">初期ステータス</label>
                                        <select class="form-select" th:field="*{status}">
                                            <option th:each="st : ${statuses}"
                                                    th:value="${st.name()}"
                                                    th:text="${st.displayName}">ステータス</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- AI Analysis Section -->
                        <div class="card mt-3">
                            <div class="card-header">
                                <span class="ai-badge">AI</span><span data-i18n="create.aiResults">解析結果（編集可）</span>
                                <small class="text-muted ms-2" data-i18n="create.autoFilled">ログ解析から自動入力されました。内容を確認・編集してください。</small>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-file-earmark-text me-1"></i><span data-i18n="create.summary">障害概要</span>
                                    </label>
                                    <textarea class="form-control" th:field="*{aiSummary}" rows="4"
                                              placeholder="障害の概要を入力してください..."></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-question-circle me-1"></i><span data-i18n="create.cause">原因候補</span>
                                    </label>
                                    <textarea class="form-control" th:field="*{aiCause}" rows="4"
                                              placeholder="推定される原因を入力してください..."></textarea>
                                </div>
                                <div class="mb-0">
                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-tools me-1"></i><span data-i18n="create.action">初動対応案</span>
                                    </label>
                                    <textarea class="form-control" th:field="*{aiAction}" rows="5"
                                              placeholder="初動対応の手順を入力してください..."></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn btn-warning fw-semibold px-4">
                                <i class="bi bi-check-lg me-1"></i><span data-i18n="create.submit">チケットを作成</span>
                            </button>
                            <a th:href="@{/incidents}" class="btn btn-outline-secondary">
                                <i class="bi bi-x me-1"></i><span data-i18n="create.cancel">キャンセル</span>
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
