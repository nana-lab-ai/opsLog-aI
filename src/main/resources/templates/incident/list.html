<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{fragments/head :: head('障害一覧')}"></head>
<body class="bg-light">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div id="page-content">
        <div class="topnav">
            <h5 class="page-title"><i class="bi bi-exclamation-triangle-fill me-2 text-warning"></i><span data-i18n="inclist.title">障害チケット一覧</span></h5>
            <div class="user-info">
                <a th:href="@{/incidents/new}" class="btn btn-sm btn-warning">
                    <i class="bi bi-plus me-1"></i><span data-i18n="inclist.newCreate">新規作成</span>
                </a>
                <a th:href="@{/log/input}" class="btn btn-sm btn-primary">
                    <i class="bi bi-search me-1"></i><span data-i18n="inclist.logAnalysis">ログ解析</span>
                </a>
            </div>
        </div>

        <div class="content-area">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}" data-i18n="bc.dashboard">ダッシュボード</a></li>
                    <li class="breadcrumb-item active" data-i18n="bc.incidents">障害一覧</li>
                </ol>
            </nav>

            <!-- Status Filter -->
            <div class="card mb-3">
                <div class="card-body py-2">
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <span class="text-muted" style="font-size:12px; font-weight:600;" data-i18n="inclist.filterLabel">フィルター:</span>
                        <a th:href="@{/incidents}" class="btn btn-sm"
                           th:classappend="${selectedStatus == null} ? 'btn-dark' : 'btn-outline-secondary'"
                           data-i18n="inclist.filterAll">
                            すべて
                        </a>
                        <a th:each="st : ${statuses}"
                           th:href="@{/incidents(status=${st.name()})}"
                           class="btn btn-sm"
                           th:classappend="${selectedStatus == st} ? 'btn-dark' : 'btn-outline-secondary'"
                           th:text="${st.displayName}">ステータス</a>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <i class="bi bi-list-ul me-2"></i><span data-i18n="inclist.cardTitle">チケット一覧</span>
                    <span class="badge bg-secondary ms-1" th:text="${#lists.size(incidents)}">0</span>
                    <span th:if="${selectedStatus != null}" class="ms-2 text-muted" style="font-size:12px;">
                        — <span th:text="${selectedStatus.displayName}"></span> <span data-i18n="inclist.filterBy">でフィルター中</span>
                    </span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th class="ps-3" style="width:40px;" data-i18n="loglist.colIndex">#</th>
                                <th data-i18n="inclist.colTitle">タイトル</th>
                                <th data-i18n="inclist.colSeverity">重要度</th>
                                <th data-i18n="inclist.colStatus">ステータス</th>
                                <th data-i18n="inclist.colCreatedAt">作成日</th>
                                <th data-i18n="inclist.colUpdatedAt">最終更新</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="inc : ${incidents}"
                                th:onclick="|location.href='/incidents/${inc.id}'|"
                                style="cursor:pointer;">
                                <td class="ps-3 text-muted" style="font-size:12px;"
                                    th:text="${inc.id}">1</td>
                                <td>
                                    <div style="font-weight:500; color:#1e2a45;"
                                         th:text="${inc.title}">タイトル</div>
                                    <div th:if="${inc.logEntry != null}" class="text-muted" style="font-size:11px;">
                                        <i class="bi bi-file-text me-1"></i>
                                        <span th:text="${#strings.abbreviate(inc.logEntry.title, 40)}"></span>
                                    </div>
                                </td>
                                <td>
                                    <span class="status-badge"
                                          th:classappend="${inc.severity.name() == 'CRITICAL'} ? 'severity-critical' :
                                                           (${inc.severity.name() == 'HIGH'} ? 'severity-high' :
                                                           (${inc.severity.name() == 'MEDIUM'} ? 'severity-medium' : 'severity-low'))"
                                          th:text="${inc.severity.displayName}">重要度</span>
                                </td>
                                <td>
                                    <span class="status-badge"
                                          th:classappend="${inc.status.name() == 'OPEN'} ? 'badge-open' :
                                                           (${inc.status.name() == 'INVESTIGATING'} ? 'badge-investigating' :
                                                           (${inc.status.name() == 'RESOLVED'} ? 'badge-resolved' : 'badge-on-hold'))"
                                          th:text="${inc.status.displayName}">ステータス</span>
                                </td>
                                <td class="text-muted" style="font-size:12px;"
                                    th:text="${#temporals.format(inc.createdAt, 'yyyy/MM/dd HH:mm')}">日時</td>
                                <td class="text-muted" style="font-size:12px;"
                                    th:text="${#temporals.format(inc.updatedAt, 'yyyy/MM/dd HH:mm')}">日時</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(incidents)}">
                                <td colspan="6" class="text-center text-muted py-5">
                                    <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                    <span data-i18n="inclist.empty">障害チケットはありません。</span><br>
                                    <a th:href="@{/incidents/new}" data-i18n="inclist.newCreate">新規作成する</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
