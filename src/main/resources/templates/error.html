<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エラー - OpsLog AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh;">
<div class="card shadow-sm text-center p-5" style="max-width:480px; width:100%;">
    <div class="mb-3">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:56px;"></i>
    </div>
    <h4 class="mb-2">
        <span th:text="${status}">エラー</span>
        <span th:if="${error != null}" class="text-muted fs-6 ms-2" th:text="${error}"></span>
    </h4>
    <p class="text-muted mb-4" style="font-size:14px;">
        エラーが発生しました。しばらくしてから再度お試しください。
    </p>
    <a href="/dashboard" class="btn btn-primary px-4">
        <i class="bi bi-house me-1"></i>ダッシュボードへ戻る
    </a>
    <div class="mt-3">
        <a href="/login" class="text-muted small">ログイン画面へ</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
