<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - OpsLog AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">
            <i class="bi bi-activity"></i>
        </div>
        <h4 class="text-center fw-bold mb-1" style="color:#1e2a45;">OpsLog AI</h4>
        <p class="text-center text-muted mb-4" style="font-size:13px;">ログ解析・障害対応管理システム</p>

        <!-- Demo notice -->
        <div class="demo-notice mb-3">
            <i class="bi bi-info-circle me-1"></i>
            <strong>デモ環境</strong>　ID: <code>demo</code>　PW: <code>demo123</code>
        </div>

        <!-- Error message -->
        <div th:if="${param.error}" class="alert alert-danger py-2" style="font-size:13px;">
            <i class="bi bi-exclamation-circle me-1"></i>
            ユーザー名またはパスワードが正しくありません。
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2" style="font-size:13px;">
            <i class="bi bi-check-circle me-1"></i>
            ログアウトしました。
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold" style="font-size:13px; color:#1e2a45;">
                    <i class="bi bi-person me-1"></i>ユーザー名
                </label>
                <input type="text" name="username" class="form-control"
                       placeholder="demo" value="demo" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold" style="font-size:13px; color:#1e2a45;">
                    <i class="bi bi-lock me-1"></i>パスワード
                </label>
                <input type="password" name="password" class="form-control"
                       placeholder="demo123" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i>ログイン
            </button>
        </form>

        <hr class="my-4">
        <div class="text-muted text-center" style="font-size:11px; line-height:1.7;">
            <i class="bi bi-shield-exclamation me-1 text-warning"></i>
            デモ環境のため、登録データはリセットされる場合があります。<br>
            個人情報・機密情報・本番ログは入力しないでください。
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
