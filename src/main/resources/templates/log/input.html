<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{fragments/head :: head('ログ解析')}"></head>
<body class="bg-light">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div id="page-content">
        <div class="topnav">
            <h5 class="page-title"><i class="bi bi-search me-2 text-primary"></i>ログ解析</h5>
            <div class="user-info">
                <a th:href="@{/dashboard}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>ダッシュボード
                </a>
            </div>
        </div>

        <div class="content-area">
            <div class="demo-notice">
                <i class="bi bi-shield-exclamation me-1 text-warning"></i>
                個人情報・機密情報・本番ログは入力しないでください。デモ用のサンプルログを使用してください。
            </div>

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">ダッシュボード</a></li>
                    <li class="breadcrumb-item active">ログ解析</li>
                </ol>
            </nav>

            <!-- レート制限エラー -->
            <div th:if="${rateLimitError}" class="alert alert-warning d-flex align-items-center gap-2">
                <i class="bi bi-clock-history flex-shrink-0"></i>
                <span th:text="${rateLimitError}"></span>
            </div>
            <!-- DB上限エラー -->
            <div th:if="${limitError}" class="alert alert-danger d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-circle flex-shrink-0"></i>
                <span th:text="${limitError}"></span>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-10">
                    <div class="card">
                        <div class="card-header">
                            <i class="bi bi-file-earmark-code me-2"></i>ログ貼り付け・解析
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/log/analyze}" method="post" th:object="${request}">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-tag me-1"></i>解析タイトル
                                        <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control"
                                           th:field="*{title}"
                                           th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'"
                                           placeholder="例: 本番APサーバー ヒープエラー 2026-05-30">
                                    <div class="invalid-feedback" th:errors="*{title}"></div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-terminal me-1"></i>ログ貼り付け
                                        <span class="text-danger">*</span>
                                    </label>
                                    <p class="text-muted mb-2" style="font-size:12px;">
                                        サーバーログ・DBログ・アプリログを貼り付けてください。
                                        <strong>ERROR / WARN / Exception / ORA- / failed / timeout / refused / denied</strong>
                                        を含む行を自動抽出します。
                                    </p>
                                    <textarea class="form-control log-textarea"
                                              th:field="*{rawLog}"
                                              th:classappend="${#fields.hasErrors('rawLog')} ? ' is-invalid'"
                                              rows="18"
                                              maxlength="30000"
                                              id="rawLog"
                                              oninput="updateCharCount(this)"
                                              placeholder="2026-05-30 09:12:34,123 INFO  [main] c.e.app.Application - Starting...&#10;2026-05-30 09:45:12,456 ERROR [http-exec-1] c.e.app.controller.ApiController - Failed to process request&#10;java.lang.NullPointerException: Cannot invoke method getData()...&#10;..."></textarea>
                                    <div class="invalid-feedback" th:errors="*{rawLog}"></div>
                                    <div class="d-flex justify-content-between mt-1">
                                        <small class="text-muted">最大 30,000 文字（<span id="charCount">0</span> / 30,000）</small>
                                        <button type="button" class="btn btn-link btn-sm p-0"
                                                onclick="loadSampleLog()">
                                            <i class="bi bi-clipboard me-1"></i>サンプルログを読み込む
                                        </button>
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-cpu me-1"></i>解析実行
                                    </button>
                                    <a th:href="@{/log/list}" class="btn btn-outline-secondary">
                                        <i class="bi bi-clock-history me-1"></i>解析履歴
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- How it works -->
                    <div class="card mt-3">
                        <div class="card-header">
                            <i class="bi bi-info-circle me-2 text-info"></i>解析フロー
                        </div>
                        <div class="card-body">
                            <div class="row text-center g-2">
                                <div class="col">
                                    <div class="p-2">
                                        <i class="bi bi-clipboard-plus text-primary" style="font-size:22px;"></i>
                                        <div style="font-size:12px; margin-top:4px; font-weight:600;">① ログ入力</div>
                                    </div>
                                </div>
                                <div class="col-1 d-flex align-items-center justify-content-center text-muted">
                                    <i class="bi bi-arrow-right"></i>
                                </div>
                                <div class="col">
                                    <div class="p-2">
                                        <i class="bi bi-funnel text-warning" style="font-size:22px;"></i>
                                        <div style="font-size:12px; margin-top:4px; font-weight:600;">② エラー抽出</div>
                                    </div>
                                </div>
                                <div class="col-1 d-flex align-items-center justify-content-center text-muted">
                                    <i class="bi bi-arrow-right"></i>
                                </div>
                                <div class="col">
                                    <div class="p-2">
                                        <i class="bi bi-robot text-info" style="font-size:22px;"></i>
                                        <div style="font-size:12px; margin-top:4px; font-weight:600;">③ AI解析</div>
                                    </div>
                                </div>
                                <div class="col-1 d-flex align-items-center justify-content-center text-muted">
                                    <i class="bi bi-arrow-right"></i>
                                </div>
                                <div class="col">
                                    <div class="p-2">
                                        <i class="bi bi-ticket-detailed text-success" style="font-size:22px;"></i>
                                        <div style="font-size:12px; margin-top:4px; font-weight:600;">④ チケット作成</div>
                                    </div>
                                </div>
                                <div class="col-1 d-flex align-items-center justify-content-center text-muted">
                                    <i class="bi bi-arrow-right"></i>
                                </div>
                                <div class="col">
                                    <div class="p-2">
                                        <i class="bi bi-file-earmark-text text-danger" style="font-size:22px;"></i>
                                        <div style="font-size:12px; margin-top:4px; font-weight:600;">⑤ 報告書生成</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function updateCharCount(el) {
    var count = el.value.length;
    var span = document.getElementById('charCount');
    if (span) {
        span.textContent = count.toLocaleString();
        span.style.color = count >= 28000 ? '#dc2626' : '';
    }
}
function loadSampleLog() {
    const sample = `2026-05-30 09:00:00,000 INFO  [main] c.e.app.Application - Application starting on port 8080
2026-05-30 09:12:34,123 WARN  [http-exec-2] c.e.app.cache.CacheManager - Cache memory usage: 78%
2026-05-30 09:23:45,456 ERROR [http-exec-4] c.e.app.controller.ApiController - Failed to process request for userId=5823
java.lang.NullPointerException: Cannot invoke method getUser() on null reference
    at com.example.app.controller.ApiController.processRequest(ApiController.java:142)
    at com.example.app.controller.ApiController.handlePost(ApiController.java:89)
2026-05-30 09:45:12,789 ERROR [http-exec-6] c.e.app.service.DataService - Database connection timeout after 30000ms
java.sql.SQLTimeoutException: Timeout waiting for connection from pool
    at com.zaxxer.hikari.pool.HikariPool.getConnection(HikariPool.java:213)
2026-05-30 10:00:00,012 WARN  [GC-Daemon] c.e.app.jvm.GCMonitor - GC overhead limit approaching: 89% heap used
2026-05-30 10:15:23,345 ERROR [main] c.e.app.Application - Critical error: Out of memory
java.lang.OutOfMemoryError: Java heap space
    at java.util.Arrays.copyOf(Arrays.java:3236)
    at com.example.app.service.ReportService.generateReport(ReportService.java:201)
2026-05-30 10:15:24,678 ERROR [main] c.e.app.Application - Application shutdown initiated`;

    document.querySelector('textarea[name="rawLog"]').value = sample;
    if (!document.querySelector('input[name="title"]').value) {
        document.querySelector('input[name="title"]').value = 'サンプル: APサーバー障害ログ ' + new Date().toISOString().slice(0,10);
    }
}
</script>
</body>
</html>
