<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{fragments/head :: head('ログ履歴')}"></head>
<body class="bg-light">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div id="page-content">
        <div class="topnav">
            <h5 class="page-title"><i class="bi bi-journal-text me-2 text-primary"></i>ログ解析履歴</h5>
            <div class="user-info">
                <a th:href="@{/log/input}" class="btn btn-sm btn-primary">
                    <i class="bi bi-plus me-1"></i>新規解析
                </a>
            </div>
        </div>

        <div class="content-area">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">ダッシュボード</a></li>
                    <li class="breadcrumb-item active">ログ履歴</li>
                </ol>
            </nav>

            <div class="card">
                <div class="card-header">
                    <i class="bi bi-clock-history me-2"></i>解析済みログ一覧
                    <span class="badge bg-secondary ms-1" th:text="${#lists.size(entries)}">0</span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th class="ps-3" style="width:40px;">#</th>
                                <th>解析タイトル</th>
                                <th style="width:80px;">区分</th>
                                <th>解析日時</th>
                                <th>抽出行数</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="entry, stat : ${entries}">
                                <td class="ps-3 text-muted" style="font-size:12px;"
                                    th:text="${stat.count}">1</td>
                                <td>
                                    <a th:href="@{/log/result/{id}(id=${entry.id})}"
                                       style="color:#1e2a45; text-decoration:none; font-weight:500;"
                                       th:text="${entry.title}">タイトル</a>
                                </td>
                                <td>
                                    <span th:if="${entry.importSource != null and entry.importSource.name() == 'AUTO'}"
                                          class="badge"
                                          style="background-color:#0dcaf0; color:#000; font-size:11px;">
                                        <i class="bi bi-folder-symlink me-1"></i>自動取込
                                    </span>
                                    <span th:if="${entry.importSource == null or entry.importSource.name() == 'MANUAL'}"
                                          class="badge bg-secondary" style="font-size:11px;">
                                        手動
                                    </span>
                                </td>
                                <td class="text-muted" style="font-size:12px;"
                                    th:text="${#temporals.format(entry.createdAt, 'yyyy/MM/dd HH:mm')}">日時</td>
                                <td>
                                    <span class="badge bg-secondary"
                                          th:text="${entry.extractedLog != null and not #strings.isEmpty(entry.extractedLog) ?
                                                    #lists.size(#strings.listSplit(entry.extractedLog, '\n')) + '行'
                                                    : '0行'}">0行</span>
                                </td>
                                <td>
                                    <a th:href="@{/log/result/{id}(id=${entry.id})}"
                                       class="btn btn-sm btn-outline-primary me-1">
                                        <i class="bi bi-eye me-1"></i>結果表示
                                    </a>
                                    <a th:href="@{/incidents/new(logEntryId=${entry.id})}"
                                       class="btn btn-sm btn-outline-warning">
                                        <i class="bi bi-ticket me-1"></i>チケット作成
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(entries)}">
                                <td colspan="6" class="text-center text-muted py-5">
                                    <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                    解析済みログはありません。<br>
                                    <a th:href="@{/log/input}">ログ解析を開始する</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
