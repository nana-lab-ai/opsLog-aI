<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav id="sidebar" th:fragment="sidebar">
    <div class="sidebar-brand">
        <span class="brand-icon">
            <i class="bi bi-activity text-white" style="font-size:16px;"></i>
        </span>
        <span class="brand-name">OpsLog AI</span>
        <span class="brand-sub" data-i18n="nav.brandSub">ログ解析・障害対応管理</span>
    </div>

    <div class="sidebar-nav">
        <span class="nav-section-label" data-i18n="nav.main">メインメニュー</span>

        <a th:href="@{/dashboard}" class="sidebar-link" data-path="/dashboard">
            <i class="bi bi-grid-1x2-fill nav-icon"></i>
            <span data-i18n="nav.dashboard">ダッシュボード</span>
        </a>

        <span class="nav-section-label" style="margin-top:12px;" data-i18n="nav.logAnalysis">ログ解析</span>

        <a th:href="@{/log/input}" class="sidebar-link" data-path="/log/input">
            <i class="bi bi-search nav-icon"></i>
            <span data-i18n="nav.logInput">ログ解析（新規）</span>
        </a>

        <a th:href="@{/log/list}" class="sidebar-link" data-path="/log/list">
            <i class="bi bi-journal-text nav-icon"></i>
            <span data-i18n="nav.logList">ログ履歴</span>
        </a>

        <span class="nav-section-label" style="margin-top:12px;" data-i18n="nav.incidentMgmt">障害管理</span>

        <a th:href="@{/incidents}" class="sidebar-link" data-path="/incidents">
            <i class="bi bi-exclamation-triangle-fill nav-icon"></i>
            <span data-i18n="nav.incidentList">障害一覧</span>
        </a>

        <a th:href="@{/incidents(status='OPEN')}" class="sidebar-link ps-4" style="font-size:12.5px;" data-path="/incidents?status=OPEN">
            <i class="bi bi-circle nav-icon" style="font-size:10px;"></i>
            <span data-i18n="nav.statusOpen">未対応</span>
        </a>
        <a th:href="@{/incidents(status='INVESTIGATING')}" class="sidebar-link ps-4" style="font-size:12.5px;" data-path="/incidents?status=INVESTIGATING">
            <i class="bi bi-circle-half nav-icon" style="font-size:10px;"></i>
            <span data-i18n="nav.statusInvestigating">調査中</span>
        </a>
        <a th:href="@{/incidents(status='RESOLVED')}" class="sidebar-link ps-4" style="font-size:12.5px;" data-path="/incidents?status=RESOLVED">
            <i class="bi bi-check-circle nav-icon" style="font-size:10px;"></i>
            <span data-i18n="nav.statusResolved">対応済み</span>
        </a>

        <span class="nav-section-label" style="margin-top:12px;" data-i18n="nav.aiFunctions">AI機能</span>

        <a th:href="@{/chat}" class="sidebar-link" data-path="/chat">
            <i class="bi bi-chat-dots-fill nav-icon"></i>
            <span data-i18n="nav.chat">AIチャット検索</span>
        </a>

        <span class="nav-section-label" style="margin-top:12px;" data-i18n="nav.settings">設定</span>

        <a th:href="@{/settings/watch}" class="sidebar-link" data-path="/settings/watch">
            <i class="bi bi-folder-symlink nav-icon"></i>
            <span data-i18n="nav.watch">監視設定</span>
        </a>
    </div>

    <div class="sidebar-footer">
        <!-- Theme & Language Controls -->
        <div class="sidebar-controls">
            <button id="theme-toggle" class="sidebar-ctrl-btn" title="テーマ切替">
                <i class="bi bi-moon-fill" id="theme-icon"></i>
                <span id="theme-label" data-i18n="theme.dark">ダーク</span>
            </button>
            <button id="lang-toggle" class="sidebar-ctrl-btn" title="言語切替">
                <i class="bi bi-translate"></i>
                <span id="lang-label">EN</span>
            </button>
        </div>
        <div class="d-flex align-items-center gap-2 mb-2">
            <div class="user-avatar" style="width:26px;height:26px;font-size:11px;">
                <i class="bi bi-person-fill"></i>
            </div>
            <span sec:authentication="name">user</span>
        </div>
        <a th:href="@{/logout}" onclick="return confirmLogout()">
            <i class="bi bi-box-arrow-left me-1"></i>
            <span data-i18n="nav.logout">ログアウト</span>
        </a>
    </div>
</nav>
<script th:src="@{/js/theme.js}"></script>
<script>
(function() {
    var path = window.location.pathname;
    document.querySelectorAll('.sidebar-link').forEach(function(a) {
        var p = a.getAttribute('data-path');
        if (p && (path === p || (p !== '/dashboard' && path.startsWith(p.split('?')[0])))) {
            a.classList.add('active');
        }
    });
})();

function confirmLogout() {
    var lang = localStorage.getItem('opslog_lang') || 'ja';
    var msg = lang === 'en' ? 'Are you sure you want to logout?' : 'ログアウトしますか？';
    return confirm(msg);
}
</script>
</body>
</html>
