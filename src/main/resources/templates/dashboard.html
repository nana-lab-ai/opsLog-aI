<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head th:replace="~{fragments/head :: head('ダッシュボード')}"></head>
<body class="bg-light">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div id="page-content">
        <!-- Top Nav -->
        <div class="topnav">
            <h5 class="page-title"><i class="bi bi-grid-1x2-fill me-2 text-primary"></i><span data-i18n="dash.title">ダッシュボード</span></h5>
            <div class="user-info">
                <span class="text-muted" style="font-size:12px;">
                    <i class="bi bi-clock me-1"></i>
                    <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy年MM月dd日 HH:mm')}"></span>
                </span>
                <div class="user-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <span sec:authentication="name"></span>
            </div>
        </div>

        <div class="content-area">
            <!-- Demo Notice -->
            <div class="demo-notice">
                <i class="bi bi-info-circle-fill me-1"></i>
                <strong data-i18n="common.demoNotice">デモ環境のため、登録データはリセットされる場合があります。</strong>
                <span data-i18n="common.securityNotice">個人情報・機密情報・本番ログは入力しないでください。</span>
            </div>

            <!-- Stats Row -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-2">
                    <div class="stat-card total">
                        <div class="stat-value" th:text="${totalIncidents}">0</div>
                        <div class="stat-label" data-i18n="dash.totalIncidents">総障害件数</div>
                    </div>
                </div>
                <div class="col-6 col-md-2">
                    <div class="stat-card open">
                        <div class="stat-value text-danger" th:text="${openCount}">0</div>
                        <div class="stat-label" data-i18n="dash.open">未対応</div>
                    </div>
                </div>
                <div class="col-6 col-md-2">
                    <div class="stat-card investing">
                        <div class="stat-value text-warning" th:text="${investigatingCount}">0</div>
                        <div class="stat-label" data-i18n="dash.investigating">調査中</div>
                    </div>
                </div>
                <div class="col-6 col-md-2">
                    <div class="stat-card resolved">
                        <div class="stat-value text-success" th:text="${resolvedCount}">0</div>
                        <div class="stat-label" data-i18n="dash.resolved">対応済み</div>
                    </div>
                </div>
                <div class="col-6 col-md-2">
                    <div class="stat-card onhold">
                        <div class="stat-value text-secondary" th:text="${onHoldCount}">0</div>
                        <div class="stat-label" data-i18n="dash.onHold">保留</div>
                    </div>
                </div>
                <div class="col-6 col-md-2">
                    <div class="stat-card" style="border-left-color:#6f42c1; cursor:pointer;"
                         onclick="location.href='/log/input'">
                        <div class="stat-value" style="color:#6f42c1;">
                            <i class="bi bi-plus-circle" style="font-size:28px;"></i>
                        </div>
                        <div class="stat-label" data-i18n="dash.newAnalysis">ログ解析（新規）</div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Recent Incidents -->
                <div class="col-12 col-lg-7">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-exclamation-triangle-fill text-warning me-2"></i><span data-i18n="dash.recentIncidents">最近の障害チケット</span></span>
                            <a th:href="@{/incidents}" class="btn btn-sm btn-outline-secondary" style="font-size:12px;" data-i18n="dash.viewAll">
                                すべて表示
                            </a>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover mb-0">
                                    <thead>
                                    <tr>
                                        <th class="ps-3" data-i18n="dash.colTitle">タイトル</th>
                                        <th data-i18n="dash.colSeverity">重要度</th>
                                        <th data-i18n="dash.colStatus">ステータス</th>
                                        <th data-i18n="dash.colCreatedAt">作成日</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="inc : ${recentIncidents}"
                                        th:onclick="|location.href='/incidents/${inc.id}'|"
                                        style="cursor:pointer;">
                                        <td class="ps-3">
                                            <span th:text="${#strings.abbreviate(inc.title, 40)}">タイトル</span>
                                        </td>
                                        <td>
                                            <span class="status-badge"
                                                  th:classappend="${inc.severity.name() == 'CRITICAL'} ? 'severity-critical' :
                                                                   (${inc.severity.name() == 'HIGH'} ? 'severity-high' :
                                                                   (${inc.severity.name() == 'MEDIUM'} ? 'severity-medium' : 'severity-low'))"
                                                  th:text="${inc.severity.displayName}">重要度</span>
                                        </td>
                                        <td>
                                            <span class="status-badge"
                                                  th:classappend="${inc.status.name() == 'OPEN'} ? 'badge-open' :
                                                                   (${inc.status.name() == 'INVESTIGATING'} ? 'badge-investigating' :
                                                                   (${inc.status.name() == 'RESOLVED'} ? 'badge-resolved' : 'badge-on-hold'))"
                                                  th:text="${inc.status.displayName}">ステータス</span>
                                        </td>
                                        <td class="text-muted" style="font-size:12px;"
                                            th:text="${#temporals.format(inc.createdAt, 'MM/dd HH:mm')}">日時</td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(recentIncidents)}">
                                        <td colspan="4" class="text-center text-muted py-4">
                                            <i class="bi bi-inbox me-1"></i><span data-i18n="dash.noIncidents">障害チケットはありません</span>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Logs -->
                <div class="col-12 col-lg-5">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-journal-text text-primary me-2"></i><span data-i18n="dash.recentLogs">最近のログ解析</span></span>
                            <a th:href="@{/log/list}" class="btn btn-sm btn-outline-secondary" style="font-size:12px;" data-i18n="dash.viewAll">
                                すべて表示
                            </a>
                        </div>
                        <div class="card-body p-0">
                            <div class="list-group list-group-flush">
                                <a th:each="entry : ${recentLogs}"
                                   th:href="@{/log/result/{id}(id=${entry.id})}"
                                   class="list-group-item list-group-item-action py-3 px-3">
                                    <div class="d-flex align-items-start">
                                        <i class="bi bi-file-earmark-text text-primary me-2 mt-1"></i>
                                        <div>
                                            <div style="font-size:13px; font-weight:500; color:#1e2a45;"
                                                 th:text="${#strings.abbreviate(entry.title, 35)}">タイトル</div>
                                            <div class="text-muted" style="font-size:11px; margin-top:2px;"
                                                 th:text="${#temporals.format(entry.createdAt, 'yyyy/MM/dd HH:mm')}">日時</div>
                                        </div>
                                    </div>
                                </a>
                                <div th:if="${#lists.isEmpty(recentLogs)}"
                                     class="text-center text-muted py-4">
                                    <i class="bi bi-inbox me-1"></i><span data-i18n="dash.noLogs">ログエントリはありません</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Actions -->
                    <div class="card mt-3">
                        <div class="card-header">
                            <i class="bi bi-lightning-fill text-warning me-2"></i><span data-i18n="dash.quickActions">クイックアクション</span>
                        </div>
                        <div class="card-body">
                            <div class="d-grid gap-2">
                                <a th:href="@{/log/input}" class="btn btn-primary btn-sm">
                                    <i class="bi bi-search me-1"></i><span data-i18n="dash.startAnalysis">ログ解析を開始</span>
                                </a>
                                <a th:href="@{/incidents/new}" class="btn btn-outline-warning btn-sm">
                                    <i class="bi bi-plus-circle me-1"></i><span data-i18n="dash.createTicket">障害チケットを作成</span>
                                </a>
                                <a th:href="@{/incidents}" class="btn btn-outline-secondary btn-sm">
                                    <i class="bi bi-list-ul me-1"></i><span data-i18n="dash.viewIncidents">障害一覧を確認</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
